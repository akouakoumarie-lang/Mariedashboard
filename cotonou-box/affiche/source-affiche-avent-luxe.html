<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:GV;src:url(fonts/GreatVibes-Regular.ttf)}
@font-face{font-family:CG;font-weight:300 700;src:url(fonts/Cormorant.ttf)}
@font-face{font-family:IS;font-style:italic;src:url(fonts/InstrumentSerif-Italic.ttf)}
@font-face{font-family:SANS;src:url(fonts/InstrumentSans-Regular.ttf)}
:root{--gold:#cdb27a;--gold2:rgba(205,178,122,.55);--gold3:rgba(205,178,122,.28);--champ:#efe2c6;--iv:#f5ede2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:1414px}
.p{position:relative;width:1000px;height:1414px;overflow:hidden;color:var(--iv);
 background:radial-gradient(75% 55% at 50% 40%,#5b1a2d 0%,#4a1424 55%,#350d19 100%)}
.f1,.f2{position:absolute;pointer-events:none}
.f1{inset:30px;border:1px solid var(--gold2)}
.f2{inset:37px;border:1px solid var(--gold3)}
/* En-tête */
.t1{position:absolute;left:96px;top:104px;font:400 132px/1.1 GV;color:var(--champ)}
.t2{position:absolute;left:132px;top:252px;font:500 38px/1 CG;letter-spacing:.34em;color:var(--iv)}
.side{position:absolute;left:640px;top:150px;width:262px}
.kicker{display:flex;align-items:center;gap:14px;font:12px/1 SANS;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
.kicker i{flex:1;height:1px;background:var(--gold2)}
.lead{margin-top:22px;font:italic 21px/1.42 IS;color:rgba(245,237,226,.9)}
.rule{height:1px;background:var(--gold2);margin:24px 0 20px;width:54px}
.price{font:500 40px/1 CG;letter-spacing:.02em;color:var(--champ);font-variant-numeric:lining-nums}
.price span{font:12px/1 SANS;letter-spacing:.3em;color:var(--gold);margin-left:8px;vertical-align:6px}
/* Mosaïque */
.g{position:absolute;overflow:hidden;background:#2a0b13}
.g img{width:100%;height:100%;object-fit:cover;display:block}
.g::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(205,178,122,.18)}
.a{left:96px;top:430px;width:262px;height:812px}
.b{left:368px;top:430px;width:262px;height:396px}
.c{left:640px;top:430px;width:264px;height:396px}
.d{left:368px;top:836px;width:536px;height:406px}
/* Pied */
.foot{position:absolute;left:96px;right:96px;top:1276px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.foot .l,.foot .r{font:11px/1.5 SANS;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,237,226,.72)}
.foot .r{text-align:right}
.foot .l b{display:block;font-weight:400;color:var(--gold);letter-spacing:.3em;margin-bottom:6px}
.foot .l span{font-size:15px;letter-spacing:.14em;color:var(--iv)}
.mark{display:flex;flex-direction:column;align-items:center;gap:8px}
.mark svg{width:34px;height:34px;fill:var(--gold)}
.mark span{font:500 15px/1 CG;letter-spacing:.34em;padding-left:.34em;color:var(--iv)}
.mark em{font:italic 15px/1 IS;color:var(--gold)}
</style></head><body><div class="p">
<div class="f1"></div><div class="f2"></div>
<div class="t1">Calendrier</div>
<div class="t2">DE L’AVENT</div>
<div class="side">
 <p class="kicker">Noël 2026<i></i></p>
 <p class="lead">Vingt-quatre jours pour découvrir les trésors du Bénin&nbsp;: saveurs, soins et artisanat, à ouvrir jusqu’à Noël.</p>
 <div class="rule"></div>
 <p class="price">45 000 <span>FCFA</span></p>
</div>
<div class="g a"><img src="source-avent/tall.jpg" style="object-position:40% 30%"></div>
<div class="g b"><img src="source-avent/gift.jpg"></div>
<div class="g c"><img src="source-avent/miel.jpg" style="object-position:55% 50%"></div>
<div class="g d"><img src="source-avent/wide.jpg" style="object-position:50% 45%"></div>
<div class="foot">
 <p class="l"><b>Commandes WhatsApp</b><span>+229 01 97 17 64 59</span></p>
 <div class="mark"><svg viewBox="0 0 60 60"><path d="M30 4C37 13 37 24 30 31 23 24 23 13 30 4Z"/><path d="M29 31C21 30 13 22 11 11 21 12 28 21 29 31Z"/><path d="M31 31C39 30 47 22 49 11 39 12 32 21 31 31Z"/><path d="M29 37C21 40 11 38 5 29 15 26 24 30 29 37Z"/><path d="M31 37C39 40 49 38 55 29 45 26 36 30 31 37Z"/><path d="M28.6 30h2.8v24h-2.8z"/><path d="M30 54c-4-5-9-6-13-4 4 3 9 4 13 4zm0 0c4-5 9-6 13-4-4 3-9 4-13 4z"/></svg><span>COTONOU BOX</span><em>Le Bénin en cadeau</em></div>
 <p class="r">Édition limitée<br>Visuel non contractuel</p>
</div>
</div></body></html>
