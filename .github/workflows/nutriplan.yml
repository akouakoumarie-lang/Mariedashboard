name: NutriPlan

on:
  push:
    paths: ['nutriplan/**', '.github/workflows/nutriplan.yml']
  pull_request:
    paths: ['nutriplan/**', '.github/workflows/nutriplan.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutriplan
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: nutriplan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nutriplan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nutriplan:nutriplan@localhost:5432/nutriplan_test?schema=public
      DATABASE_URL: postgresql://nutriplan:nutriplan@localhost:5432/nutriplan_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nutriplan/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
