:root{--gold:#cdb27a;--gold2:rgba(205,178,122,.55);--gold3:rgba(205,178,122,.28);--champ:#efe2c6;--iv:#f5ede2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:1414px}

 background:radial-gradient(70% 50% at 50% 45%,#5b1a2d 0%,#4a1424 55%,#350d19 100%)}

.kicker i{width:60px;height:1px;background:var(--gold2)}
.t1{position:absolute;top:212px;left:0;right:0;font:400 136px/1.1 GV;color:var(--champ)}
.t2{position:absolute;top:366px;left:0;right:0;font:500 36px/1 CG;letter-spacing:.38em;padding-left:.38em}
.grid{position:absolute;top:452px;left:50%;transform:translateX(-50%)}
.lead{position:absolute;top:884px;left:200px;right:200px;font:italic 25px/1.4 IS;color:rgba(245,237,226,.92)}
.brands{position:absolute;top:986px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;font:600 16px/1 CG;letter-spacing:.2em;color:var(--gold)}

.rule{position:absolute;top:1030px;left:50%;width:60px;margin-left:-30px;height:1px;background:var(--gold2)}

.cta b{font:400 12px/1 SANS;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.cta span{font:500 26px/1 CG;font-variant-numeric:lining-nums;letter-spacing:.08em;color:var(--iv)}
.foot{position:absolute;bottom:68px;left:0;right:0;font:italic 18px/1 IS;color:rgba(239,226,198,.75)}
