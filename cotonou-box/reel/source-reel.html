<script>
const $=id=>document.getElementById(id);
const cl=(x)=>Math.max(0,Math.min(1,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function fade(el,t,a,b,dy=24){const k=eo(p(t,a,b));el.style.opacity=k;el.style.transform=(el.id==='cta'?'translateX(-50%) ':'')+`translateY(${(1-k)*dy}px)`;}
// poussière dorée déterministe
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=Array.from({length:46},()=>({x:rnd()*1080,y:rnd()*1920,r:.8+rnd()*2.2,v:12+rnd()*28,ph:rnd()*6.28,a:.15+rnd()*.4}));
const ctx=$('dust').getContext('2d');
const order=[7, 14, 3, 21, 10, 18, 1, 16, 23, 5, 12, 8, 20, 11, 2, 15, 22, 6, 9, 19, 13, 4, 17, 24];
const rank=[...order.keys()].sort((a,b)=>((a*7)%24)-((b*7)%24));
const appear={};rank.forEach((ci,k)=>appear[ci]=4.3+k*0.115);
window.setT=function(t){
 $('bg').style.transform=`scale(${1+0.04*Math.sin(t/16*Math.PI)})`;
 ctx.clearRect(0,0,1080,1920);
 for(const q of P){const y=((q.y-q.v*t)%1920+1920)%1920;const tw=.5+.5*Math.sin(q.ph+t*1.6);ctx.fillStyle=`rgba(225,196,130,${q.a*tw*cl(t/1.5)})`;ctx.beginPath();ctx.arc(q.x+Math.sin(q.ph+t*.5)*8,y,q.r,0,6.283);ctx.fill();}
 $('fr1').style.strokeDashoffset=1-eio(p(t,0,1.5));
 $('fr2').style.strokeDashoffset=1-eio(p(t,.25,1.8));
 fade($('emb'),t,.5,1.4,16);
 const kb=eo(p(t,1.0,2.0));$('brand').style.opacity=kb;$('brand').style.letterSpacing=(0.8-0.44*kb)+'em';
 fade($('kick'),t,1.8,2.5,10);
 const kt=eio(p(t,2.2,3.5));$('t1').style.opacity=kt>0?1:0;$('t1').style.clipPath=`inset(0 ${(1-kt)*100}% 0 0)`;
 const k2=eo(p(t,3.2,4.1));$('t2').style.opacity=k2;$('t2').style.letterSpacing=(0.7-0.32*k2)+'em';
 document.querySelectorAll('.cell').forEach(g=>{const i=+g.dataset.i,k=g.dataset.k;const a=appear[i];const e=eo(p(t,a,a+.45));
   g.style.opacity=e;g.style.transform=`scale(${.7+.3*e})`;
